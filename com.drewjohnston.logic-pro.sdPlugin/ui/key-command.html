<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Key">
      <sdpi-textfield setting="key" placeholder="single key, or: return, space, esc, f1…f12, up, down, left, right"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="⌘ Command">
      <sdpi-checkbox setting="command"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="⌥ Option">
      <sdpi-checkbox setting="option"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="⌃ Control">
      <sdpi-checkbox setting="control"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="⇧ Shift">
      <sdpi-checkbox setting="shift"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item>
      <sdpi-textblock>Assign the command a shortcut in Logic first (Logic Pro → Key Commands → Edit…), then mirror it here.</sdpi-textblock>
    </sdpi-item>
  </body>
</html>
